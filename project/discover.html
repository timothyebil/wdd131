    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>

<body>
    <header>
        <div class="header-container">
            
                <svg xmlns="http://w3.org" viewBox="0 0 100 100" width="45" height="45" aria-hidden="true" class="logo-svg">
                    <circle cx="50" cy="50" r="46" class="svg-bg"/>
                    <circle cx="70" cy="35" r="12" class="svg-sun"/>
                    <polygon points="20,75 45,35 65,65 80,50 90,75" class="svg-mountain"/>
                    <path d="M15,82 Q35,70 50,82 T85,82" class="svg-river"/>
                </svg>
                <h1>Explore Uganda</h1>
            </div>
            <button id="menu-toggle" aria-label="Toggle Navigation Menu" aria-expanded="false">☰</button>
            <nav id="primary-nav">
                <a href="index.html" class="nav-item">Home</a>
                <a href="discover.html" class="nav-item active">Discover</a>
                <a href="book.html" class="nav-item">Book Adventure</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="directory-container">
            <h2>Regional Destination Clusters</h2>
            <p>Isolate destination profiles instantaneously below without causing heavy browser reloads.</p>
            
            <div class="filter-controls-row">
                <button class="filter-btn active" data-terrain="all">All Terrains</button>
                <button class="filter-btn" data-terrain="river">Rivers &amp; Falls</button>
                <button class="filter-btn" data-terrain="savanna">Savanna Plains</button>
                <button class="filter-btn" data-terrain="forest">Dense Forests</button>
                <button class="filter-btn" data-terrain="mountain">Mountain Slopes</button>
            </div>

            <div id="directory-grid" class="cards-layout-grid">
                <!-- Data populated dynamically via app.js -->
            </div>
        </section>
    </main>

    <footer>
