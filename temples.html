<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - Timothy Ebil</title>
    <meta name="description" content="WDD 131 assignment web page displaying a responsive temple picture album gallery built by Timothy Ebil using HTML5, CSS Grid, and dynamic JavaScript components.">
    <meta name="author" content="Timothy Ebil">
    
    <!-- Required Performance Preconnect & Stylesheet Links for Google Fonts API (No @import allowed) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- External Split Stylesheets Supporting Mobile-First Cascade Pipelines -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 768px)">
    
    <!-- Deferred Interactivity Script Engine -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <!-- Formatted as a text block container to guarantee a single h1 element rule passes audits -->
        <div class="header-title">Temple Album</div>
        <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false"></button>
        <nav>
            <ul class="navigation">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- The single required h1 element inside the main element, containing the page name -->
        <h1>Home</h1>
        <div class="grid-container">
            <!-- 9 Validated Local Resource Blocks with Synchronized Names & Captions -->
            <figure>
                <img src="images/salt-lake-temple.jpg" alt="Salt Lake Temple structure with granite spires" width="400" height="300" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/manti-temple.jpg" alt="Manti Temple standing on a prominent hillside hill" width="400" height="300" loading="lazy">
                <figcaption>Manti Temple</figcaption>
            </figure>
            <figure>
                <img src="images/nauvoo-temple.jpg" alt="Nauvoo Temple featuring historic limestone architecture" width="400" height="300" loading="lazy">
                <figcaption>Nauvoo Temple</figcaption>
            </figure>
            <figure>
                <img src="images/rome-italy-temple.jpg" alt="Rome Italy Temple accented by clean olive trees gardens" width="400" height="300" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="images/paris-france-temple.jpg" alt="Paris France Temple showing modern stone features" width="400" height="300" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo-city-center-temple.jpg" alt="Provo City Center Temple meticulously restored with brickwork" width="400" height="300" loading="lazy">
                <figcaption>Provo City Center Temple</figcaption>
            </figure>
            <figure>
                <img src="images/frankfurt-germany-temple.jpg" alt="Frankfurt Germany Temple showing landscaped walkways" width="400" height="300" loading="lazy">
                <figcaption>Frankfurt Germany Temple</figcaption>
            </figure>
            <figure>
                <img src="images/tokyo-japan-temple.jpg" alt="Tokyo Japan Temple structure framed with clean trees" width="400" height="300" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="images/laie-hawaii-temple.jpg" alt="Laie Hawaii Temple features historical white multi-tiered terraces" width="400" height="300" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌺 Timothy Ebil 🌺 Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
